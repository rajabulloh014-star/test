name: Build Kernel Zorn (BakaSU + SUSFS + NoMount)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: zorn-trees/android_kernel_xiaomi_sm8650
          path: kernel
          ref: lineage-24.0

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache flex \
            g++-multilib gcc-multilib git gnupg gperf imagemagick \
            lib32readline-dev lib32z1-dev libelf-dev lz4 lld \
            libsdl1.2-dev libssl-dev libxml2-dev libxml2-utils lzop \
            pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
            python3 python-is-python3

      - name: Setup Toolchain (Clang 22.0.2)
        run: |
          git clone --depth=1 https://github.com/Neutron-Toolchains/clang-build -b main ${{ github.workspace }}/clang
          echo "${{ github.workspace }}/clang/bin" >> $GITHUB_PATH

      - name: Patch libbpf for C23 Compatibility
        working-directory: kernel
        run: |
          # Terapkan patch upstream untuk memperbaiki error -Wdiscarded-qualifiers
          sed -i 's/char \*next_path;/const char *next_path;/' tools/lib/bpf/libbpf.c
          sed -i 's/char \*res;/const char *res;/' tools/lib/bpf/libbpf.c
          sed -i 's/char sym_trim\[256\], \*psym_trim = sym_trim, \*sym_sfx;/char sym_trim[256], *psym_trim = sym_trim; const char *sym_sfx;/' tools/lib/bpf/libbpf.c
          echo "Patch libbpf berhasil diterapkan."

      - name: Integrate BakaSU
        working-directory: kernel
        run: |
          curl -LSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh" | bash

      - name: Integrate NoMount
        working-directory: kernel
        run: |
          git clone --depth=1 https://github.com/maxsteeel/nomount.git nomount-src
          cd nomount-src
          bash setup.sh || echo "Peringatan: NoMount setup.sh gagal."

      - name: Apply SUSFS Patch
        working-directory: kernel
        run: |
          KERNEL_VERSION=$(make kernelversion | cut -d. -f1,2)
          git clone --depth=1 https://github.com/zzh20188/GKI_KernelSU_SUSFS.git susfs-repo
          PATCH_FILE=$(find susfs-repo -name "*gki*${KERNEL_VERSION}*.patch" | head -n 1)
          if [ -n "$PATCH_FILE" ]; then
            echo "Menerapkan patch: $PATCH_FILE"
            patch -p1 < "$PATCH_FILE" || echo "Peringatan: Patch SUSFS gagal."
          fi

      - name: Configure Kernel (GKI + Fragment Zorn)
        working-directory: kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          mkdir -p out
          make O=out ARCH=arm64 gki_defconfig
          cat arch/arm64/configs/vendor/zorn_GKI.config >> out/.config
          make O=out ARCH=arm64 olddefconfig

      - name: Build Kernel
        working-directory: kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          
          # SOLUSI: Arahkan variabel LLVM langsung ke dalam folder 'bin'
          export LLVM_BIN="${{ github.workspace }}/clang/bin/"
          
          # Cukup panggil LLVM=$LLVM_BIN, jangan definisikan CC, LD, AR secara manual lagi
          make -j$(nproc) O=out ARCH=arm64 \
               LLVM="$LLVM_BIN" \
               CROSS_COMPILE=aarch64-linux-gnu- \
               CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel
          cd anykernel

          KERNEL_IMAGE=""
          for f in "Image.gz-dtb" "Image.gz" "Image"; do
            if [ -f "${{ github.workspace }}/kernel/out/arch/arm64/boot/$f" ]; then
              KERNEL_IMAGE="${{ github.workspace }}/kernel/out/arch/arm64/boot/$f"
              break
            fi
          done

          if [ -f "$KERNEL_IMAGE" ]; then
            cp "$KERNEL_IMAGE" .
          else
            echo "Error: File Image Kernel tidak ditemukan!"
            exit 1
          fi

          sed -i 's/device.name1=.*/device.name1=zorn/' anykernel.sh
          sed -i 's/kernel.string=.*/kernel.string=Zorn Kernel | BakaSU + SUSFS + NoMount/' anykernel.sh
          
          ZIP_NAME="zorn-kernel-bakasu-susfs-$(date +%Y%m%d-%H%M).zip"
          zip -r9 "../$ZIP_NAME" * -x .git README.md '*placeholder'

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zorn-kernel-flashable-zip
          path: zorn-kernel-*.zip
